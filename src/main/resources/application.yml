spring:
  application:
    name: split-bill-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/split_bill}
    username: ${DB_USERNAME:split_bill}
    password: ${DB_PASSWORD:split_bill}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

split-bill:
  bootstrap:
    admin-token: ${BOOTSTRAP_ADMIN_TOKEN:}
  auth:
    secret: ${AUTH_TOKEN_SECRET:change-this-local-dev-secret}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5000,http://localhost:8080,http://localhost:5173,http://localhost:5555,http://127.0.0.1:3000,http://127.0.0.1:5000,http://127.0.0.1:8080,http://127.0.0.1:5173,http://127.0.0.1:5555}
