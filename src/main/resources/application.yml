spring:
  application:
    name: split-bill-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/split_bill}
    username: ${DB_USERNAME:split_bill}
    password: ${DB_PASSWORD:split_bill}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
